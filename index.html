<!DOCTYPE html>
<html>
<head>
<style>
    body{
        background-color:#2d5a27;
    
    }
    p {
        color:white;
        background-color:rgba(0,0,0,0.5);
        padding:10px;
        display:inline-block;
        margin-top:10px;



    }
    button{
        bottom:20px;
        left:50%;
        transform:translateX(-50%);
        position:fixed;
        font: size 30px;
        background-color:white;
        color:black;
        padding: 20px 100px;
        border:none;
        border-radius: 10px;
     }
 @media(max-width:1000px) {
    button{
        width:90%;
        padding:20px 100px;
        left:5%;
        font-size:100px;
        transform:none;
        }

        div img {
            padding:100px 100px;
        }
        }
</style>
</head>
<body>
    <button type="button" onclick="dokunma()">SOHBET İÇİN DOKUN</button>
         <p id="sonuc"></p>
         <div style="position:fixed;top: 55%;left:50%;transform:translate(-50%,-50%);">
            <img src="resim.jpg" style="width:400px;height:400px; object-fit:cover;">    
         </div>
         <div style="position:fixed;top: 15%;left:50%;transform:translate(-50%,-50%);">
            <img src="PANDA(1).png" style="width:200px;height:200px; object-fit:cover;">    
         </div>




    <script>
        function dokunma(){
          let metin="";
          for(let i=0;i<999;i++){
            metin+=" ERROR!<br>";
          }
            document.getElementById("sonuc").innerHTML=metin;
            alert("BEYNİM YETMEDİ");

        }
        </script>
        </body>
        </html>
